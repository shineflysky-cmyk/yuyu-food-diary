<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff5f3">
<title>魚魚專屬 Q版飲食日記館</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#775564;font-family:ui-rounded,"Noto Sans TC",system-ui,sans-serif;background:radial-gradient(ellipse at 0 0,#ffe8ee 0,transparent 35%),radial-gradient(ellipse at 100% 0,#fff3d9 0,transparent 38%),#fff9f4}main{max-width:1160px;margin:auto;padding:28px 20px 70px}header{text-align:center;padding:28px 0}header h1{color:#b85f7b;font-size:clamp(29px,5vw,47px);margin:10px}header p{color:#a7828d}.mascot{font-size:60px}.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:22px 0 30px}.tabs button{border:1px solid #f2cad5;background:white;border-radius:99px;padding:10px 18px;color:#b97083;font-weight:800;cursor:pointer}.tabs button.active{background:#e989a4;color:#fff}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:22px}.card{background:white;border:2px solid #f8dbe2;overflow:hidden;border-radius:25px;box-shadow:0 10px 30px #ac78921c}.pic{display:block;cursor:zoom-in;padding:0;border:0;width:100%;background:linear-gradient(160deg,#fff1eb,#ffe6ee)}.pic img{display:block;width:100%;height:360px;object-fit:contain}.pic:hover{opacity:.94}.meta{padding:18px 20px}.date{color:#c26d89;font-weight:900;font-size:18px}.meta p{color:#9b858b;font-size:13px;line-height:1.7}.hidden{display:none}footer{margin:30px 0 10px;text-align:center;color:#a98d98;font-size:13px;line-height:1.9}.zoom{position:fixed;inset:0;background:#21141ce8;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}.zoom.visible{display:flex}.zoom img{max-width:98vw;max-height:92vh;object-fit:contain;border-radius:8px}.close{position:absolute;top:12px;right:18px;background:#fff;border:0;border-radius:50%;font-size:24px;width:43px;height:43px;cursor:pointer}@media(max-width:700px){.pic img{height:auto;max-height:380px}}
</style>
</head>
<body>
<main>
<header><div class="mascot">🐰🌷</div><div style="letter-spacing:.17em;font-size:12px;font-weight:800;color:#d3809a">YUYU'S ORIGINAL FOOD DIARY</div><h1>魚魚專屬 Q版飲食日記館</h1><p>這裡收藏我們真正製作過的每一張飲食小卡 ♡</p></header>
<nav class="tabs" id="tabs"></nav>
<section class="gallery" id="gallery"></section>
<footer>每一張小卡都只記錄魚魚實際吃過、喝過的東西 ♡<br>資料更新後重新整理頁面即可看到最新版本。</footer>
</main>
<div class="zoom" id="zoom" onclick="this.classList.remove('visible')"><button class="close" aria-label="關閉">×</button><img id="zoomImg" alt="放大的飲食小卡"></div>
<script>
const repo='shineflysky-cmyk/yuyu-food-diary';
const version='20261021';
const rawBase=`https://raw.githubusercontent.com/${repo}/main/cards/`;
const api=`https://api.github.com/repos/${repo}/contents/cards?ref=main`;
let cards=[];
function zoom(btn){document.getElementById('zoomImg').src=btn.querySelector('img').src;document.getElementById('zoom').classList.add('visible')}
function filterDay(day,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',day!=='all'&&c.dataset.date!==day))}
function render(){
 const tabs=document.getElementById('tabs'),gallery=document.getElementById('gallery');
 tabs.innerHTML='<button class="active" onclick="filterDay(\'all\',this)">全部日記</button>';
 cards.forEach(c=>{const d=c.name.slice(5,10).replace('-','/');tabs.innerHTML+=`<button onclick="filterDay('${d}',this)">${d}</button>`});
 gallery.innerHTML=cards.map(c=>{const d=c.name.slice(5,10).replace('-','/');const full=c.name.slice(0,10);const src=`${rawBase}${c.name}?v=${version}`;return `<article class="card" data-date="${d}"><button class="pic" aria-label="放大${d}完整Q版日記" onclick="zoom(this)"><img loading="lazy" src="${src}" alt="${full} 魚魚專屬Q版飲食日記"></button><div class="meta"><div class="date">${full}</div><p>點擊小卡可放大查看完整內容 ♡</p></div></article>`}).join('');
}
fetch(api).then(r=>r.json()).then(list=>{cards=list.filter(x=>/^2026-\d\d-\d\d\.svg$/.test(x.name)).sort((a,b)=>b.name.localeCompare(a.name));render()}).catch(()=>{cards=[{name:'2026-10-20.svg'},{name:'2026-10-19.svg'},{name:'2026-10-18.svg'}];render()});
</script>
</body>
</html>
