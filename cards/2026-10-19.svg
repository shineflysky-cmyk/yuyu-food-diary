  <path d="M157 10 L157 -35" stroke="#5b4a4e" stroke-width="8" stroke-linecap="round"/>
  <path d="M85 150 Q157 175 230 150" fill="none" stroke="#d7c7ad" stroke-width="7"/>
  <text x="157" y="340" text-anchor="middle" font-size="30" font-weight="800">無糖烏龍鮮奶茶 ×1杯</text>
  <text x="157" y="380" text-anchor="middle" font-size="23" fill="#9b7180">自己用鮮奶泡製</text>
 </g>

 <rect x="105" y="930" width="990" height="145" rx="30" fill="#fff"/>
 <text x="600" y="985" text-anchor="middle" font-size="28" font-weight="900" fill="#b85f7b">10/19 今日紀錄</text>
 <text x="600" y="1035" text-anchor="middle" font-size="25" fill="#816d73">油飯 1 碗＋雞蛋 1 顆＋無糖烏龍鮮奶茶 1 杯</text>
 <text x="600" y="1075" text-anchor="middle" font-size="22" fill="#a1848c">全天估算：670 kcal／26.5 g 蛋白質</text>

 <rect x="55" y="1190" width="1090" height="150" rx="35" fill="#fcebf0"/>
 <text x="600" y="1250" text-anchor="middle" font-size="28" font-weight="900" fill="#c06b84">只記錄魚魚真的吃過、喝過的東西 ♡</text>
 <text x="600" y="1300" text-anchor="middle" font-size="23" fill="#9b7180">這一天沒有加入未確認的食物</text>
 <text x="600" y="1415" text-anchor="middle" font-size="30" fill="#b36b79">慢慢吃、好好照顧自己 ♡</text>
</g>
</svg>