  <text x="170" y="285" text-anchor="middle" font-size="30" font-weight="800">油飯 ×1碗</text>
  <text x="170" y="325" text-anchor="middle" font-size="23" fill="#9b7180">約 220g</text>
 </g>
 <!-- egg -->
 <g transform="translate(470 505)">
  <ellipse cx="130" cy="225" rx="120" ry="38" fill="#ead9c5"/>
  <path d="M130 35 C72 35 35 100 42 160 C48 215 83 244 130 244 C177 244 212 215 218 160 C225 100 188 35 130 35Z" fill="#fffdf7" stroke="#5b4a4e" stroke-width="8"/>
  <ellipse cx="130" cy="153" rx="44" ry="42" fill="#f3c85c" stroke="#d8a73d" stroke-width="5"/>
  <circle cx="116" cy="140" r="8" fill="#fff2b0" opacity=".8"/>
  <text x="130" y="300" text-anchor="middle" font-size="30" font-weight="800">雞蛋 ×1</text>
 </g>
 <!-- milk tea -->
 <g transform="translate(790 485)">
  <path d="M55 75 L260 75 L235 280 Q157 315 80 280Z" fill="#f7f2e8" stroke="#5b4a4e" stroke-width="8"/>
  <path d="M75 115 L240 115 L225 270 Q157 292 90 270Z" fill="#eee3cf"/>
