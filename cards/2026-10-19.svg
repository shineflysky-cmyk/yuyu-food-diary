<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0f3"/><stop offset="1" stop-color="#fff7e7"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="1500" fill="url(#bg)"/>
<g font-family="Arial, 'Noto Sans TC', sans-serif" fill="#5b4a4e">
 <text x="70" y="90" font-size="62" font-weight="800" fill="#b95c77">10/19（一）</text>
 <text x="600" y="82" text-anchor="middle" font-size="38" font-weight="800" fill="#8f5267">魚魚專屬</text>
 <text x="600" y="135" text-anchor="middle" font-size="54" font-weight="900" fill="#d96b7e">Q版飲食日記</text>
 <text x="1130" y="90" text-anchor="end" font-size="28" fill="#b36b79">今天也有好好吃飯 ♡</text>

 <rect x="55" y="175" width="1090" height="145" rx="35" fill="#fff" filter="url(#shadow)"/>
 <text x="300" y="220" text-anchor="middle" font-size="26" fill="#ad7886">今日總熱量</text>
 <text x="300" y="280" text-anchor="middle" font-size="52" font-weight="900" fill="#e66d8b">670 kcal</text>
 <text x="820" y="220" text-anchor="middle" font-size="26" fill="#6e9b88">今日蛋白質</text>
 <text x="820" y="280" text-anchor="middle" font-size="52" font-weight="900" fill="#4c9b82">26.5 g</text>
 <path d="M575 200v95" stroke="#efd9df" stroke-width="3"/>

 <rect x="55" y="355" width="1090" height="790" rx="35" fill="#fff5ec" stroke="#f3cbd2" stroke-width="4" filter="url(#shadow)"/>
 <rect x="80" y="380" width="185" height="65" rx="32" fill="#ef829e"/>
 <text x="172" y="424" text-anchor="middle" font-size="34" font-weight="900" fill="#fff">今日餐點</text>
 <text x="1060" y="425" text-anchor="end" font-size="25" fill="#9b7180">10/19 實際吃喝 ♡</text>

 <!-- oil rice -->
 <g transform="translate(105 505)">
  <ellipse cx="170" cy="210" rx="155" ry="42" fill="#d8a46c"/>
  <path d="M25 175 Q170 235 315 175 L290 65 Q170 115 50 65Z" fill="#fffdf8" stroke="#5b4a4e" stroke-width="8"/>
