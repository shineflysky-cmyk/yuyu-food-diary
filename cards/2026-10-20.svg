  <rect x="105" y="1360" width="760" height="25" rx="12" fill="#c9e5d5"/>
  <rect x="105" y="1360" width="757" height="25" rx="12" fill="#63ad89"/>
  <text x="910" y="1383" font-size="31" font-weight="900" fill="#4c9b82">99.6 g／達標 ✨</text>
